name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (Java 17 + Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar e empacotar o WAR
        run: mvn -B -ntp clean package
      - uses: actions/upload-artifact@v4
        with:
          name: ongsave-war
          path: target/ongsave.war
          retention-days: 7

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - name: docker build
        run: docker build -t ongsave:ci .
